name: Test

on:
  # Run pushes only once they land on the main branch. Pull requests run on
  # pull_request below, which avoids duplicate push + PR runs for PR branches.
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm test
